name: Build Android APK

on:
  push:
    branches: [ "main" ] # Runs every time you update your code

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Cordova and Ionic/Capacitor CLI
      run: npm install -g @ionic/cli @capacitor/assets @capacitor/cli

    - name: Install Project Dependencies
      run: npm install

    - name: Build Web App Assets
      run: npm run build --if-present # Builds your HTML/JS assets if you use a build script

    - name: Setup Android Project
      run: |
        npx cap init "My App" "com.example.myapp" --web-dir=www --nosync || true
        npx cap add android || true
        npx cap sync android

    - name: Build Android Debug APK
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Upload Downloadable APK File
      uses: actions/upload-artifact@v4
      with:
        name: my-app-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
